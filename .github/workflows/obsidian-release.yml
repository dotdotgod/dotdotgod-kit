name: Obsidian release

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

concurrency:
  group: obsidian-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Materialize ignored runtime parser assets in a clean checkout
        run: pnpm run generate
      - name: Reject tracked generated-runtime drift
        run: git diff --exit-code
      - run: pnpm run verify
      - name: Build reproducible plugin and manual-install archive
        run: node packages/obsidian/scripts/release.mjs
      - name: Attest plugin artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            packages/obsidian/dist/main.js
            packages/obsidian/dist/styles.css
            packages/obsidian/dist/manifest.json
      - name: Keep manual ZIP outside Obsidian release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotdotgod-traceability-manual-install
          path: packages/obsidian/dist/*.zip
          if-no-files-found: error
          retention-days: 90
      - name: Publish only Obsidian-supported release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            packages/obsidian/dist/main.js \
            packages/obsidian/dist/manifest.json \
            packages/obsidian/dist/styles.css \
            --verify-tag --title "$RELEASE_TAG — Community review fixes" \
            --notes-file "docs/report/RELEASE_${RELEASE_TAG//./_}.md"
      - name: Verify published attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify packages/obsidian/dist/main.js --repo "$GITHUB_REPOSITORY"
          gh attestation verify packages/obsidian/dist/styles.css --repo "$GITHUB_REPOSITORY"
