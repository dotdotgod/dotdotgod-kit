name: Trello Power-Up Pages

on:
  push:
    branches:
      - main
    paths:
      - "packages/trello-power-up/**"
      - ".github/workflows/trello-power-up-pages.yml"
  pull_request:
    paths:
      - "packages/trello-power-up/**"
      - ".github/workflows/trello-power-up-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trello-power-up-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build static Pages artifact
        run: |
          mkdir -p dist/trello
          cp -R packages/trello-power-up/index.html dist/trello/index.html
          cp -R packages/trello-power-up/section.html dist/trello/section.html
          cp -R packages/trello-power-up/preview.html dist/trello/preview.html
          cp -R packages/trello-power-up/icon.svg dist/trello/icon.svg
          cp -R packages/trello-power-up/src dist/trello/src

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}trello/index.html
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
