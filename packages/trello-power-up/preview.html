<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dotdotgod Power-Up Preview</title>
    <style>
      body {
        background: #f4f5f7;
        color: #172b4d;
        font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 32px;
      }
      .card {
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(9, 30, 66, 0.14);
        margin: 0 auto;
        max-width: 720px;
        padding: 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 6px;
      }
      .hint {
        color: #5e6c84;
        margin: 0 0 18px;
      }
      #dotdotgod-view {
        border-top: 1px solid #dfe1e6;
        padding-top: 16px;
      }
      .entry {
        border: 1px solid #dfe1e6;
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 8px;
      }
      .repo {
        font-weight: 700;
        margin-bottom: 4px;
      }
      .meta {
        color: #5e6c84;
        font-size: 12px;
        margin-top: 4px;
      }
      a {
        color: #0c66e4;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>dotdotgod linked docs preview</h1>
      <p class="hint">Local preview of the Trello card-back section using sample <code>dotdotgod-view</code> custom field data.</p>
      <main id="dotdotgod-view"></main>
    </section>
    <script type="module">
      import { parseDotdotgodViewPayload, renderLinkedDocsHtml } from './src/index.js';

      const samplePayload = JSON.stringify({
        version: 1,
        entries: [
          {
            repositoryKey: 'example/backend',
            repositoryLabel: 'backend',
            docsPath: 'docs/trello/payment-api.md',
            githubUrl: 'https://github.com/example/backend/blob/main/docs/trello/payment-api.md',
            trelloUrl: 'https://trello.com/c/AbCdEf12/',
            title: 'Payment API',
            summary: 'Implement backend payment API behavior and connect the checkout flow to the payment service.',
            traceabilityState: 'present',
            traceabilityDetails: ['implementedBy: 1', 'verifiedBy: 1'],
          },
          {
            repositoryKey: 'example/frontend',
            repositoryLabel: 'frontend',
            docsPath: 'docs/trello/payment-ui.md',
            githubUrl: 'https://github.com/example/frontend/blob/main/docs/trello/payment-ui.md',
            trelloUrl: 'https://trello.com/c/AbCdEf12/',
            title: 'Payment UI',
            summary: 'Add checkout payment form states, validation copy, and handoff links for QA.',
            traceabilityState: 'not_required',
            traceabilityDetails: [],
          },
        ],
      });

      const parsed = parseDotdotgodViewPayload(samplePayload);
      document.getElementById('dotdotgod-view').innerHTML = parsed.ok
        ? renderLinkedDocsHtml(parsed.entries)
        : `<p class="meta">${parsed.error}</p>`;
    </script>
  </body>
</html>
