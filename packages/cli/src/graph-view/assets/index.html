<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>dotdotgod Traceability</title><link rel="stylesheet" href="/app.css">
<header><h1>dotdotgod · Traceability</h1><div id="legend"></div></header>
<canvas aria-label="File relationship graph"></canvas>
<aside>
  <details open><summary id="title">Graph options</summary>
    <label><input id="documents" type="checkbox"><span id="documents-label">Documents only</span></label>
    <label><input id="colors" type="checkbox" checked><span id="colors-label">Show color legend</span></label>
    <label><input id="weights" type="checkbox" checked><span id="weights-label">Weight-based line width</span></label>
    <button id="reload">Reload</button>
  </details>
  <p id="status" role="status"></p>
  <input id="search" aria-label="Search files" placeholder="Search files">
  <ul id="files"></ul><p id="path"></p><button id="copy" disabled>Copy path</button>
</aside>
<div id="tooltip" hidden></div>
<script src="/vendor/d3.js"></script><script src="/policy.js"></script>
<script src="/file-list.js"></script><script src="/graph-client.js"></script><script src="/layout.js"></script><script src="/app.js"></script>
</html>
